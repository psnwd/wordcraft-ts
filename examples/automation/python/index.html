<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WordCraft · Python</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; background: #14161a; color: #e8eaed; font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
      .app { display: grid; grid-template-columns: 1fr 380px; grid-template-rows: auto 1fr; height: 100vh; }
      .bar { grid-column: 1 / 3; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 12px; background: #1b1e24; border-bottom: 1px solid #2d323c; }
      .brand { font-weight: 700; margin-right: 8px; }
      .spacer { flex: 1; }
      button, select { font: inherit; color: inherit; background: #23272f; border: 1px solid #2d323c; border-radius: 8px; padding: 6px 12px; cursor: pointer; }
      button:hover:not(:disabled) { border-color: #4c8dff; }
      button:disabled { opacity: .45; cursor: default; }
      .primary { background: #2f6fe0; border-color: #2f6fe0; color: #fff; }
      .status { color: #9aa3b2; }
      .stage { position: relative; background: #e6e6e6; min-height: 0; }
      .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      aside { display: flex; flex-direction: column; gap: 8px; padding: 12px; background: #1b1e24; border-left: 1px solid #2d323c; min-height: 0; overflow: auto; }
      aside h3 { margin: 0; font-size: 11px; text-transform: uppercase; letter-spacing: .8px; color: #9aa3b2; }
      textarea { width: 100%; height: 210px; resize: vertical; font: 12px/1.4 ui-monospace, Consolas, monospace; color: inherit; background: #14161a; border: 1px solid #2d323c; border-radius: 8px; padding: 8px; }
      label { color: #9aa3b2; display: flex; gap: 6px; align-items: center; }
      pre { margin: 0; flex: 1; min-height: 120px; overflow: auto; font: 12px/1.4 ui-monospace, Consolas, monospace; background: #14161a; border: 1px solid #2d323c; border-radius: 8px; padding: 8px; white-space: pre-wrap; }
      .err { color: #ff7b7b; }
      @media (max-width: 900px) { .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr auto; } aside { border-left: 0; border-top: 1px solid #2d323c; max-height: 45vh; } .bar { grid-column: 1; } }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="bar">
        <span class="brand">WordCraft · Python</span>
        <span class="spacer"></span>
        <span class="status" id="status">loading…</span>
      </div>
      <div class="stage"><canvas id="canvas"></canvas></div>
      <aside>
        <h3>1 · Data (JSON rows)</h3>
        <textarea id="data" spellcheck="false"></textarea>
        <label><input type="checkbox" id="totals" checked /> Add a totals row for numeric columns</label>
        <button class="primary" id="generate" disabled>Generate in Python → open in editor</button>
        <h3>2 · Edit the document, then</h3>
        <button id="analyze" disabled>Analyze with Python ← read tables back</button>
        <pre id="out">Python's answer appears here.</pre>
      </aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
