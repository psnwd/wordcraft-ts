<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WordCraft · Python</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; background: #14161a; color: #e8eaed; font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
      .app { display: grid; grid-template-columns: 1fr 380px; grid-template-rows: auto 1fr; height: 100vh; }
      .bar { grid-column: 1 / 3; display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: #1b1e24; border-bottom: 1px solid #2d323c; }
      .brand { font-weight: 700; }
      .spacer { flex: 1; }
      .status { color: #9aa3b2; }
      .stage { position: relative; background: #e6e6e6; min-height: 0; }
      .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      aside { display: flex; flex-direction: column; gap: 10px; padding: 12px; background: #1b1e24; border-left: 1px solid #2d323c; min-height: 0; overflow: auto; }
      h3 { margin: 4px 0 0; font-size: 11px; text-transform: uppercase; letter-spacing: .8px; color: #9aa3b2; }
      .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
      .tabs button { border-radius: 0; }
      .tabs button:first-child { border-radius: 8px 0 0 8px; }
      .tabs button:last-child { border-radius: 0 8px 8px 0; border-left: 0; }
      .tabs button[aria-pressed="true"] { background: #2f6fe0; border-color: #2f6fe0; color: #fff; }
      form { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
      form .wide { grid-column: 1 / 3; }
      label { display: flex; flex-direction: column; gap: 3px; color: #9aa3b2; font-size: 12px; }
      label.check { flex-direction: row; align-items: center; gap: 6px; }
      input, select, textarea, button { font: inherit; color: #e8eaed; background: #23272f; border: 1px solid #2d323c; border-radius: 8px; padding: 6px 10px; }
      input[type="checkbox"] { width: auto; }
      textarea { width: 100%; height: 190px; min-height: 90px; resize: vertical; font: 12px/1.4 ui-monospace, Consolas, monospace; background: #14161a; }
      button { cursor: pointer; }
      button:hover:not(:disabled) { border-color: #4c8dff; }
      button:disabled { opacity: .45; cursor: default; }
      .primary { background: #2f6fe0; border-color: #2f6fe0; color: #fff; }
      #result { flex: 1; min-height: 120px; overflow: auto; font-size: 12px; }
      #result.err { color: #ff7b7b; }
      .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
      .chip { background: #23272f; border: 1px solid #2d323c; border-radius: 999px; padding: 2px 10px; }
      .outline { margin: 0 0 8px; padding: 0; list-style: none; }
      .outline li { padding: 1px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .outline .l2 { padding-left: 14px; color: #c4c9d4; }
      .outline .l3 { padding-left: 28px; color: #9aa3b2; }
      details pre { margin: 6px 0 0; max-height: 220px; overflow: auto; font: 11px/1.4 ui-monospace, Consolas, monospace; background: #14161a; border: 1px solid #2d323c; border-radius: 8px; padding: 8px; }
      @media (max-width: 900px) { .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr auto; } aside { border-left: 0; border-top: 1px solid #2d323c; max-height: 50vh; } .bar { grid-column: 1; } }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="bar">
        <span class="brand">WordCraft · Python</span>
        <span class="spacer"></span>
        <span class="status" id="status">loading…</span>
      </div>
      <div class="stage"><canvas id="canvas"></canvas></div>
      <aside>
        <h3>1 · Generate in Python</h3>
        <div class="tabs">
          <button id="tab-table" aria-pressed="true" type="button">Table from JSON</button>
          <button id="tab-report" aria-pressed="false" type="button">Report from JSON</button>
        </div>

        <form id="table-form">
          <label class="wide">Data (JSON rows)<textarea id="data" spellcheck="false"></textarea></label>
          <label class="check wide"><input id="totals" type="checkbox" checked /> Add a totals row for numeric columns</label>
          <button class="primary wide" id="generate-table" type="submit" disabled>Generate table in Python → open in editor</button>
        </form>

        <form id="report-form" hidden>
          <label class="wide">Company <input name="company" value="Alder Street Press" maxlength="80" /></label>
          <label>Year <input name="year" type="number" value="2025" min="1990" max="2100" /></label>
          <label>Seed <input name="seed" type="number" value="7" /></label>
          <label>Regions
            <select name="regions"><option>2</option><option>3</option><option selected>4</option><option>5</option><option>6</option></select>
          </label>
          <label>Appendix rows <input name="appendix_rows" type="number" value="80" min="0" max="50000" /></label>
          <label class="check wide"><input name="charts" type="checkbox" checked /> Include charts</label>
          <button class="wide" id="make-sample" type="button" disabled>Create sample JSON in Python</button>
          <label class="wide">Report JSON <textarea id="spec" spellcheck="false" placeholder="Paste a report spec, load a .json file, or create a sample (schema: automation/REPORT_JSON.md)"></textarea></label>
          <span class="row"><button id="load-json" type="button">Load .json file…</button> <button id="clear-json" type="button">Clear</button></span>
          <span id="spec-info" class="status"></span>
          <input id="json-file" type="file" accept=".json,application/json" hidden />
          <button class="primary wide" id="generate-report" type="submit" disabled>Build report from JSON → open in editor</button>
        </form>

        <h3>2 · Edit, then</h3>
        <button id="analyze" disabled>Analyze with Python ← read it back</button>
        <div id="result">Python's answer appears here.</div>
      </aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
